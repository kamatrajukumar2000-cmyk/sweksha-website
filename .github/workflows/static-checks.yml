name: Website static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline JavaScript in HTML pages
        run: node .github/scripts/check-inline-js.mjs
