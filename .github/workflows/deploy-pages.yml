name: Deploy SWEKSHA website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb # Node 24-compatible upstream revision
        with:
          # A distinct name per run attempt prevents duplicate artifacts on GitHub Actions re-runs.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Deploy only the artifact uploaded by this exact attempt.
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
