<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Image Viewer | SWEKSHA CVD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:Arial,Helvetica,sans-serif}
.viewer-top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(180deg,rgba(0,0,0,.86),rgba(0,0,0,.12))}
.back-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:11px 17px;background:#0b806f;color:#fff;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.viewer-label{font-size:13px;color:#dce7ef}
.viewer-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:82px 18px 24px}
.viewer-stage img{display:block;max-width:100%;max-height:calc(100vh - 110px);object-fit:contain}
.error{color:#ffd7d7;text-align:center;padding:30px}
</style>
</head>
<body>
<header class="viewer-top">
<button class="back-btn" id="backToWebsite" type="button">← Back to Website</button>
<span class="viewer-label">SWEKSHA CVD · Full-size image</span>
</header>
<main class="viewer-stage"><img id="fullImage" alt="Full-size SWEKSHA website image"><p class="error" id="errorMessage" hidden>Image could not be opened.</p></main>
<script>
(()=>{"use strict";
const params=new URLSearchParams(location.search);
const src=params.get("src");
const returnTo=params.get("return")||new URL("./",location.href).href;
const image=document.getElementById("fullImage");
const error=document.getElementById("errorMessage");
if(src){try{const u=new URL(src,location.href);if(!["http:","https:","data:"].includes(u.protocol))throw new Error("Invalid image URL");image.src=u.href;image.addEventListener("error",()=>{image.hidden=true;error.hidden=false})}catch(_){image.hidden=true;error.hidden=false}}else{image.hidden=true;error.hidden=false}
document.getElementById("backToWebsite").addEventListener("click",()=>{if(history.length>1){history.back()}else{location.href=returnTo}});
})();
</script>
</body>
</html>
